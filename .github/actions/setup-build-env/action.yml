name: 'Set up build environment'
description: 'JDK 21 (Temurin, Maven cache) + Maven 3.9.9 — shared by all MoreUnit CI jobs. Must run AFTER actions/checkout (local action).'
runs:
  using: 'composite'
  steps:
    - name: Set up Java ☕️
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'maven'

    - name: Cache TestNG p2 repository
      uses: actions/cache@v6
      with:
        path: ~/.m2/repository/.cache/tycho/https/testng.org
        key: tycho-testng-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: tycho-testng-${{ runner.os }}-

    - name: Setup Maven
      uses: stCarolas/setup-maven@v5
      with:
        maven-version: 3.9.9
